<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #0b0f19;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      background: var(--bg);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app-box {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.5rem; font-weight: 800; color: #a5b4fc; margin-bottom: 6px; }
    header p { font-size: 0.9rem; color: var(--text-muted); }

    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; text-align: left; }
    label { font-size: 0.85rem; font-weight: 700; color: #cbd5e1; }
    select {
      padding: 13px 16px;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
    }
    .btn-main {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      transition: 0.2s;
    }
    .btn-main:active { transform: scale(0.98); }

    .top-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(165, 180, 252, 0.3);
    }
    .progress-bar {
      height: 8px;
      width: 100%;
      background: #334155;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      transition: width 0.25s;
    }

    .vocab-card {
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 26px 20px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .vocab-word { font-size: 1.9rem; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .vocab-type { display: inline-block; font-size: 0.85rem; color: #818cf8; background: rgba(129, 140, 248, 0.15); padding: 3px 12px; border-radius: 6px; font-weight: 600; }
    .hint-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 12px; }

    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .opt-btn {
      padding: 14px 18px;
      border-radius: 12px;
      background: #1e293b;
      border: 1.5px solid var(--border);
      color: #f1f5f9;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.15s;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #28334e; }
    .opt-btn.correct { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--success) !important; color: #4ade80 !important; }
    .opt-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; color: #f87171 !important; }

    .flashcard-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .btn-fc { padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
    .btn-fc-wrong { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
    .btn-fc-correct { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: #86efac; }

    .btn-next {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #f8fafc;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;

    .result-score { font-size: 2.8rem; font-weight: 800; color: #818cf8; margin: 10px 0; }
    .mistake-list { max-height: 280px; overflow-y: auto; text-align: left; display: flex; flex-direction: column; gap: 8px; margin: 16px 0; padding-right: 4px; }

  </style>
</head>
<body>

<div class="app-box">
  <header>
    <h1>TRỌN BỘ TỪ VỰNG TIẾNG ANH 12</h1>
    <p id="totalVocabCountHeader">Đang tải toàn bộ từ vựng giáo trình...</p>
  </header>

  <!-- MÀN HÌNH CÀI ĐẶT -->
  <div id="setupView">
    <div class="form-group">
      <label>1. Chọn phạm vi ôn thi:</label>
      <select id="unitSelect">
        <option value="ALL">Toàn bộ 250+ từ vựng (Unit 1 + Unit 2 + Unit 3 + Review 1)</option>
        <option value="1">Unit 1: Life Story We Admire (Khoảng 90 từ)</option>
        <option value="2">Unit 2: A Multicultural World (Khoảng 95 từ)</option>
        <option value="3">Unit 3: Green Living (Khoảng 85 từ)</option>
        <option value="R1">Review 1 (Language & Skills)</option>
      </select>
    </div>

    <div class="form-group">
      <label>2. Phương thức ôn luyện:</label>
      <select id="modeSelect">
        <option value="mc_eng_to_vie">Trắc nghiệm: Cho từ Tiếng Anh ➔ Chọn nghĩa Tiếng Việt</option>
        <option value="mc_vie_to_eng">Trắc nghiệm: Cho nghĩa Tiếng Việt ➔ Chọn từ Tiếng Anh</option>
        <option value="flashcard">Lật thẻ phản xạ (Active Recall - Tự nhớ nghĩa trước)</option>
      </select>
    </div>

    <button type="button" class="btn-main" id="startBtn">BẮT ĐẦU ÔN TẬP NGAY</button>
  </div>

  <!-- MÀN HÌNH BÀI LÀM -->
  <div id="quizView" style="display: none;">
    <div class="top-stats">
      <span class="badge" id="badgeUnit">Unit 1</span>
      <span id="statProgress">1 / 250</span>
      <span id="statScore">Đúng: 0 | Sai: 0</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- KHUNG TỪ VỰNG -->
    <div class="vocab-card" id="cardBox" onclick="handleCardClick()">
      <div class="vocab-word" id="displayWord">admire</div>
      <div class="vocab-type" id="displayType">(v)</div>
      <div class="hint-sub" id="displayHint"></div>
    </div>

    <!-- KHU TRẮC NGHIỆM -->
    <div id="multipleChoiceArea" class="options-grid"></div>

    <!-- KHU LẬT THẺ -->
    <div id="flashcardArea" style="display: none;">
      <div class="flashcard-actions">
        <button type="button" class="btn-fc btn-fc-wrong" onclick="evalFlashcard(false)">❌ Chưa thuộc</button>
        <button type="button" class="btn-fc btn-fc-correct" onclick="evalFlashcard(true)">✅ Đã nhớ chuẩn</button>
      </div>
    </div>

    <button type="button" class="btn-next" id="nextBtn" style="display: none;" onclick="goToNext()">Câu tiếp theo ➔</button>
  </div>

  <!-- MÀN HÌNH TỔNG KẾT & CÂU SAI -->
  <div id="resultView" class="result-box" style="display: none;">
    <h2>Kết Quả Lượt Ôn</h2>
    <div class="result-score" id="scorePercent">0%</div>
    <p id="resultText" style="color: var(--text-muted);"></p>

    <div id="mistakeSection" style="display: none;">
      <h3 style="font-size: 1rem; color: #f87171; margin-top: 16px; text-align: left;">Các từ bạn đã làm sai:</h3>
      <div class="mistake-list" id="mistakeList"></div>
      <button type="button" class="btn-main" style="background: #ea580c; margin-bottom: 10px;" onclick="retryMistakes()">🔁 Luyện riêng danh sách câu sai này</button>
    </div>

    <button type="button" class="btn-main" style="background: #334155; margin-top: 8px;" onclick="backToMenu()">Quay lại Menu chính</button>
  </div>
</div>

  // --- REVIEW 1 ---
  { word: "energy-efficient", type: "adj", meaning: "tiết kiệm năng lượng, sử dụng hiệu quả", unit: "R1" },
  { word: "liver", type: "n", meaning: "lá gan", unit: "R1" },
  { word: "ethnic minority", type: "n", meaning: "dân tộc thiểu số", unit: "R1" },
  { word: "explore", type: "v", meaning: "khám phá, thám hiểm, tìm hiểu", unit: "R1" },
  { word: "exploration", type: "n", meaning: "sự khám phá, sự thám hiểm", unit: "R1" },
  { word: "infect", type: "v", meaning: "lây nhiễm, truyền bệnh", unit: "R1" },
  { word: "infection", type: "n", meaning: "sự nhiễm bệnh, sự lây nhiễm", unit: "R1" },
  { word: "infectious", type: "adj", meaning: "truyền nhiễm, dễ lây", unit: "R1" },
  { word: "bacterium (pl: bacteria)", type: "n", meaning: "vi khuẩn / các vi khuẩn", unit: "R1" },

  { word: "fund", type: "n/v", meaning: "quỹ, khoản tài trợ / tài trợ, cấp vốn", unit: "R1" },

  { word: "malaria", type: "n", meaning: "bệnh sốt rét", unit: "R1" },
  { word: "remarkable", type: "adj", meaning: "đáng chú ý, đáng kinh ngạc, nổi bật", unit: "R1" },
  { word: "bleed - bled - bled", type: "v", meaning: "chảy máu", unit: "R1" },
  { word: "bleeding", type: "n", meaning: "sự chảy máu", unit: "R1" },

// CẬP NHẬT SỐ LƯỢNG LÊN TIÊU ĐỀ
document.getElementById('totalVocabCountHeader').innerText = `Đã nạp đầy đủ ${FULL_VOCAB.length} từ vựng từ sách!`;

let quizQueue = [];
let qIndex = 0;
let numCorrect = 0;
let numWrong = 0;
let mistakeArr = [];
let quizMode = "";
let currentCorrect = "";
let cardRevealed = false;

document.addEventListener("DOMContentLoaded", function() {
  const startBtn = document.getElementById("startBtn");
  if (startBtn) {
    startBtn.onclick = beginQuiz;
  }
});

function beginQuiz() {
  const selectedUnit = document.getElementById("unitSelect").value;
  quizMode = document.getElementById("modeSelect").value;

  let pool = FULL_VOCAB;
  if (selectedUnit !== "ALL") {
    pool = FULL_VOCAB.filter(item => item.unit === selectedUnit);
  }

  quizQueue = shuffleArray([...pool]);
  qIndex = 0;
  numCorrect = 0;
  numWrong = 0;
  mistakeArr = [];

  document.getElementById("setupView").style.display = "none";
  document.getElementById("resultView").style.display = "none";
  document.getElementById("quizView").style.display = "block";

  loadQuestion();
}

function loadQuestion() {
  const item = quizQueue[qIndex];
  const total = quizQueue.length;

  document.getElementById("badgeUnit").innerText = item.unit === "R1" ? "Review 1" : "Unit " + item.unit;
  document.getElementById("statProgress").innerText = (qIndex + 1) + " / " + total;
  document.getElementById("statScore").innerText = `Đúng: ${numCorrect} | Sai: ${numWrong}`;
  document.getElementById("progressFill").style.width = ((qIndex / total) * 100) + "%";
  document.getElementById("nextBtn").style.display = "none";

  const isFlashcard = (quizMode === "flashcard");
  document.getElementById("multipleChoiceArea").style.display = isFlashcard ? "none" : "flex";
  document.getElementById("flashcardArea").style.display = isFlashcard ? "block" : "none";

  cardRevealed = false;

  if (isFlashcard) {
    document.getElementById("displayWord").innerText = item.word;
    document.getElementById("displayType").innerText = "(" + item.type + ")";
    document.getElementById("displayHint").innerText = "👉 Bấm vào khung này để lật xem đáp án nghĩa";
  } else {
    const isEngToVie = (quizMode === "mc_eng_to_vie");
    document.getElementById("displayWord").innerText = isEngToVie ? item.word : item.meaning;
    document.getElementById("displayType").innerText = "(" + item.type + ")";
    document.getElementById("displayHint").innerText = isEngToVie ? "Chọn nghĩa Tiếng Việt tương ứng:" : "Chọn từ Tiếng Anh tương ứng:";

    currentCorrect = isEngToVie ? item.meaning : item.word;
    const targetProp = isEngToVie ? "meaning" : "word";

    // 4 ĐÁP ÁN ĐỘC NHẤT KHÔNG TRÙNG
    const others = shuffleArray(FULL_VOCAB.filter(x => x[targetProp] !== currentCorrect));
    const setOfOpts = new Set([currentCorrect]);
    for (let o of others) {
      setOfOpts.add(o[targetProp]);
      if (setOfOpts.size === 4) break;
    }

    const finalOpts = shuffleArray(Array.from(setOfOpts));
    const container = document.getElementById("multipleChoiceArea");
    container.innerHTML = "";

    const labels = ["A", "B", "C", "D"];
    finalOpts.forEach((txt, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt-btn";
      btn.innerHTML = `<span style="color:#818cf8; font-weight:700;">${labels[i]}.</span> <span>${txt}</span>`;
      btn.onclick = function() { checkAnswer(btn, txt, item); };
      container.appendChild(btn);
    });
  }
}

function handleCardClick() {
  if (quizMode !== "flashcard") return;
  const item = quizQueue[qIndex];
  cardRevealed = !cardRevealed;

  if (cardRevealed) {
    document.getElementById("displayWord").innerText = item.meaning;
    document.getElementById("displayType").innerText = item.word + " (" + item.type + ")";
    document.getElementById("displayHint").innerText = "Bạn đã tự nhớ đúng hay quên? Bấm nút bên dưới:";
  } else {
    document.getElementById("displayWord").innerText = item.word;
    document.getElementById("displayType").innerText = "(" + item.type + ")";
    document.getElementById("displayHint").innerText = "👉 Bấm vào khung này để lật xem đáp án nghĩa";
  }
}

function checkAnswer(btn, selectedText, item) {
  const allBtns = document.querySelectorAll(".opt-btn");
  allBtns.forEach(b => b.disabled = true);

  if (selectedText === currentCorrect) {
    btn.classList.add("correct");
    numCorrect++;
  } else {
    btn.classList.add("wrong");
    numWrong++;
    if (!mistakeArr.some(m => m.word === item.word)) {
      mistakeArr.push(item);
    }
    allBtns.forEach(b => {
      if (b.innerText.includes(currentCorrect)) b.classList.add("correct");
    });
  }

  document.getElementById("statScore").innerText = `Đúng: ${numCorrect} | Sai: ${numWrong}`;
  document.getElementById("nextBtn").style.display = "block";
}

function evalFlashcard(isKnown) {
  const item = quizQueue[qIndex];
  if (isKnown) {
    numCorrect++;
  } else {
    numWrong++;
    if (!mistakeArr.some(m => m.word === item.word)) {
      mistakeArr.push(item);
    }
  }
  goToNext();
}

function goToNext() {
  qIndex++;
  if (qIndex < quizQueue.length) {
    loadQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  document.getElementById("quizView").style.display = "none";
  document.getElementById("resultView").style.display = "block";

  const total = quizQueue.length;
  const pct = Math.round((numCorrect / total) * 100);
  document.getElementById("scorePercent").innerText = pct + "%";
  document.getElementById("resultText").innerText = `Bạn trả lời đúng ${numCorrect} / ${total} câu (Làm sai: ${numWrong} câu)`;

  const mistakeSection = document.getElementById("mistakeSection");
  const listEl = document.getElementById("mistakeList");
  listEl.innerHTML = "";

  if (mistakeArr.length > 0) {
    mistakeSection.style.display = "block";
    mistakeArr.forEach(m => {
      const row = document.createElement("div");
      row.className = "mistake-item";
      row.innerHTML = `<b>${m.word}</b> <span style="color:#86efac;">${m.meaning}</span>`;
      listEl.appendChild(row);
    });
  } else {
    mistakeSection.style.display = "none";
  }
}

function retryMistakes() {
  quizQueue = shuffleArray([...mistakeArr]);
  qIndex = 0;
  numCorrect = 0;
  numWrong = 0;
  mistakeArr = [];

  document.getElementById("resultView").style.display = "none";
  document.getElementById("quizView").style.display = "block";
  loadQuestion();
}

function backToMenu() {
  document.getElementById("resultView").style.display = "none";
  document.getElementById("quizView").style.display = "none";
  document.getElementById("setupView").style.display = "block";
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
